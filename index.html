
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Trânsito Inteligente</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🚦 Simulador de Trânsito Inteligente</h1>
        <p>Projeto de Desenvolvimento de Sistemas</p>
    </header>

    <main>
        <section class="painel">
            <h2>Painel de Controle</h2>

            <div class="botoes">
                <button id="iniciar">▶ Iniciar</button>
                <button id="pausar">⏸ Pausar</button>
                <button id="reiniciar">↻ Reiniciar</button>
                <button id="solicitar">🚶 Solicitar travessia</button>
            </div>

            <div class="informacoes">
                <p>Semáforo: 
                    <strong id="estado">VERDE</strong>
                </p>

                <p>Tempo restante: 
                    <strong id="tempo">12</strong> segundos
                </p>

                <p>Pedestres: 
                    <strong id="pedestres">Aguardando</strong>
                </p>

                <p>Simulação: 
                    <strong id="status">Parada</strong>
                </p>
            </div>

        </section>
    </main>

</body>
</html>
